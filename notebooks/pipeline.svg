<?xml version="1.0" encoding="UTF-8"?><svg viewBox="0 0 906 150" width="906" height="150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CLIPPR pipeline: a target RNA passes through ppr, a joint choice of cuts and overhangs, codon optimisation, assembly and QC to become orderable DNA fragments, with a fallback from codons to a different split"><text x="0" y="55" font-family="ui-sans-serif,system-ui" font-size="11" fill="#7d918a" fill-opacity=".85">target</text><text x="0" y="70" font-family="ui-monospace,monospace" font-size="12.5" fill="#7d918a">AAAAUGUGG</text><path d="M78 60 l11 0 m-4 -3.5 l4 3.5 l-4 3.5" fill="none" stroke="#7d918a" stroke-opacity=".6" stroke-width="1.3"/><rect x="96" y="34" width="112" height="52" rx="4" fill="none" stroke="#7d918a" stroke-opacity=".5"/><text x="152.0" y="55" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="600" fill="#7d918a">ppr</text><text x="152.0" y="72" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="10.5" fill="#7d918a" fill-opacity=".72">RNA -> protein</text><path d="M211 60 l9 0 m-3 -3 l3 3 l-3 3" fill="none" stroke="#7d918a" stroke-opacity=".6" stroke-width="1.3"/><rect x="224" y="34" width="150" height="52" rx="4" fill="none" stroke="#7d918a" stroke-opacity=".5"/><text x="299.0" y="55" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="600" fill="#7d918a">cuts + overhangs</text><text x="299.0" y="72" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="10.5" fill="#7d918a" fill-opacity=".72">chosen together</text><path d="M377 60 l9 0 m-3 -3 l3 3 l-3 3" fill="none" stroke="#7d918a" stroke-opacity=".6" stroke-width="1.3"/><rect x="390" y="34" width="140" height="52" rx="4" fill="none" stroke="#7d918a" stroke-opacity=".5"/><text x="460.0" y="55" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="600" fill="#7d918a">codons</text><text x="460.0" y="72" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="10.5" fill="#7d918a" fill-opacity=".72">locked, then optimised</text><path d="M533 60 l9 0 m-3 -3 l3 3 l-3 3" fill="none" stroke="#7d918a" stroke-opacity=".6" stroke-width="1.3"/><rect x="546" y="34" width="112" height="52" rx="4" fill="none" stroke="#7d918a" stroke-opacity=".5"/><text x="602.0" y="55" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="600" fill="#7d918a">assembly</text><text x="602.0" y="72" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="10.5" fill="#7d918a" fill-opacity=".72">fragments</text><path d="M661 60 l9 0 m-3 -3 l3 3 l-3 3" fill="none" stroke="#7d918a" stroke-opacity=".6" stroke-width="1.3"/><rect x="674" y="34" width="112" height="52" rx="4" fill="none" stroke="#7d918a" stroke-opacity=".5"/><text x="730.0" y="55" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="600" fill="#7d918a">qc</text><text x="730.0" y="72" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="10.5" fill="#7d918a" fill-opacity=".72">worth ordering?</text><path d="M460.0 86 L460.0 102 L299.0 102 L299.0 90 m-3 4 l3 -4 l3 4" fill="none" stroke="#7d918a" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="3 2.5"/><text x="379.5" y="115" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="10" fill="#7d918a" fill-opacity=".62">no sequence satisfies them? take the next split</text><text x="800" y="55" font-family="ui-sans-serif,system-ui" font-size="11" fill="#7d918a" fill-opacity=".85">order</text><text x="800" y="70" font-family="ui-sans-serif,system-ui" font-size="12.5" fill="#7d918a">4-7 fragments</text><text x="0" y="84" font-family="ui-sans-serif,system-ui" font-size="9.5" fill="#7d918a" fill-opacity=".6">typed, or chosen</text><text x="0" y="95" font-family="ui-sans-serif,system-ui" font-size="9.5" fill="#7d918a" fill-opacity=".6">from a region</text><text x="96" y="140" font-family="ui-sans-serif,system-ui" font-size="10.5" fill="#7d918a" fill-opacity=".7">overhangs are chosen before the sequence is optimised, then locked into it</text></svg>