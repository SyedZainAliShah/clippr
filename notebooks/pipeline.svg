<?xml version="1.0" encoding="UTF-8"?><svg viewBox="0 0 1004 122" width="1004" height="122" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CLIPPR pipeline: target RNA through six stages to orderable DNA"><text x="0" y="55" font-family="ui-sans-serif,system-ui" font-size="11" fill="#7d918a" fill-opacity=".85">target</text><text x="0" y="70" font-family="ui-monospace,monospace" font-size="12.5" fill="#7d918a">AAAAUGUGG</text><path d="M78 60 l11 0 m-4 -3.5 l4 3.5 l-4 3.5" fill="none" stroke="#7d918a" stroke-opacity=".6" stroke-width="1.3"/><rect x="96" y="34" width="118" height="52" rx="4" fill="none" stroke="#7d918a" stroke-opacity=".5"/><text x="155.0" y="55" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="600" fill="#7d918a">ppr</text><text x="155.0" y="72" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="10.5" fill="#7d918a" fill-opacity=".72">RNA -> protein</text><path d="M217 60 l9 0 m-3 -3 l3 3 l-3 3" fill="none" stroke="#7d918a" stroke-opacity=".6" stroke-width="1.3"/><rect x="230" y="34" width="118" height="52" rx="4" fill="none" stroke="#7d918a" stroke-opacity=".5"/><text x="289.0" y="55" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="600" fill="#7d918a">arelf</text><text x="289.0" y="72" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="10.5" fill="#7d918a" fill-opacity=".72">where to cut</text><path d="M351 60 l9 0 m-3 -3 l3 3 l-3 3" fill="none" stroke="#7d918a" stroke-opacity=".6" stroke-width="1.3"/><rect x="364" y="34" width="118" height="52" rx="4" fill="none" stroke="#7d918a" stroke-opacity=".5"/><text x="423.0" y="55" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="600" fill="#7d918a">overhangs</text><text x="423.0" y="72" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="10.5" fill="#7d918a" fill-opacity=".72">will it join?</text><path d="M485 60 l9 0 m-3 -3 l3 3 l-3 3" fill="none" stroke="#7d918a" stroke-opacity=".6" stroke-width="1.3"/><rect x="498" y="34" width="118" height="52" rx="4" fill="none" stroke="#7d918a" stroke-opacity=".5"/><text x="557.0" y="55" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="600" fill="#7d918a">codons</text><text x="557.0" y="72" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="10.5" fill="#7d918a" fill-opacity=".72">make it real</text><path d="M619 60 l9 0 m-3 -3 l3 3 l-3 3" fill="none" stroke="#7d918a" stroke-opacity=".6" stroke-width="1.3"/><rect x="632" y="34" width="118" height="52" rx="4" fill="none" stroke="#7d918a" stroke-opacity=".5"/><text x="691.0" y="55" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="600" fill="#7d918a">assembly</text><text x="691.0" y="72" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="10.5" fill="#7d918a" fill-opacity=".72">fragments</text><path d="M753 60 l9 0 m-3 -3 l3 3 l-3 3" fill="none" stroke="#7d918a" stroke-opacity=".6" stroke-width="1.3"/><rect x="766" y="34" width="118" height="52" rx="4" fill="none" stroke="#7d918a" stroke-opacity=".5"/><text x="825.0" y="55" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="600" fill="#7d918a">qc</text><text x="825.0" y="72" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="10.5" fill="#7d918a" fill-opacity=".72">worth ordering?</text><text x="898" y="55" font-family="ui-sans-serif,system-ui" font-size="11" fill="#7d918a" fill-opacity=".85">order</text><text x="898" y="70" font-family="ui-sans-serif,system-ui" font-size="12.5" fill="#7d918a">4-7 fragments</text><text x="96" y="112" font-family="ui-sans-serif,system-ui" font-size="10.5" fill="#7d918a" fill-opacity=".7">overhangs are chosen before the sequence is optimised, then locked into it</text></svg>