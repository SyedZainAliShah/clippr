[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clippr"
version = "0.1.0"
description = "Design tooling for synthetic PPR regulators (iGEM Marburg 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "iGEM Marburg 2026" }]
keywords = ["PPR", "pentatricopeptide", "chloroplast", "synthetic biology", "Chlamydomonas"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "biopython>=1.81",
  "dnachisel>=3.2",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
figures = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["clippr*"]

[tool.setuptools.package-data]
# The ligation matrices must travel with the package: without them `set_fidelity` cannot
# score anything, and an install that omits them fails at design time rather than at import.
clippr = ["scaffold.json", "data/matrices/*.xlsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
