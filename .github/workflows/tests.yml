# The suite only ever ran when somebody remembered to run it. Users install this package
# straight from `main`, so `main` is the release: a broken commit there reaches every new
# install silently. This makes that impossible to miss.
#
# It runs the test suite only. The release check is deliberately not run here -- it builds a
# wheel, executes both notebooks and folds RNA, which needs the pinned local environment and
# takes far longer than a push hook should. `validation/release_check.py` stays the gate for
# a release; this is the gate for a commit.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from requires-python, and a current release. The floor is the one that
        # actually catches things: syntax and typing that only newer Pythons accept.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the suite
        # PYTHONUTF8: the package writes text without an explicit encoding in places, which
        # is latent on Linux but the documented failure mode on Windows. Setting it here
        # keeps CI honest about the environment the project actually documents.
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q

      - name: Check the notebook badge matches the suite
        # Cheap, and it catches the specific drift that release check 12 exists to catch:
        # a test count quoted in the README and the notebook that no longer matches reality.
        run: |
          python - <<'PY'
          import re, subprocess, sys
          from pathlib import Path
          stated = int(re.search(r"TESTS = (\d+)",
                                 Path("tools/build_notebook.py").read_text()).group(1))
          out = subprocess.run([sys.executable, "-m", "pytest", "--collect-only", "-q"],
                               capture_output=True, text=True).stdout
          actual = sum(int(n) for n in re.findall(r"^tests/.*: (\d+)$", out, re.M))
          print(f"badge says {stated}, suite collects {actual}")
          sys.exit(0 if stated == actual else 1)
          PY
