# The suite only ever ran when somebody remembered to run it. Users install this package
# straight from `main`, so `main` is the release: a broken commit there reaches every new
# install silently. This makes that impossible to miss.
#
# It runs the test suite only. The release check is deliberately not run here -- it builds a
# wheel, executes both notebooks and folds RNA, which needs the pinned local environment and
# takes far longer than a push hook should. `validation/release_check.py` stays the gate for
# a release; this is the gate for a commit.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from requires-python, and a current release. The floor is the one that
        # actually catches things: syntax and typing that only newer Pythons accept.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the suite
        # PYTHONUTF8: the package writes text without an explicit encoding in places, which
        # is latent on Linux but the documented failure mode on Windows. Setting it here
        # keeps CI honest about the environment the project actually documents.
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q

# The badge count is deliberately NOT checked here. `TESTS` in tools/build_notebook.py is the
# count with this project's gitignored inputs present -- the codon table, the GRASP
# supplementary, the phase B artefacts -- and several tests are parameterised over them. A
# clean checkout legitimately collects fewer (1225 against 1183 on the run that taught me
# this), so comparing the two here fails on a correct tree. Release check 12 already gates
# the badge in the environment where the number means something.
